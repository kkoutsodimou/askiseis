<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html{color-scheme:light}body{margin:0}</style><title>Ξύπνα τον υπολογιστή</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Noto+Sans:wght@400;700&display=swap">
<style>
:root{--bg:#f3f5fb;--card:#fff;--fg:#1b2238;--muted:#5a6482;--line:#d5daea;--accent:#3447c9;--accent-fg:#fff;--ok:#16875a;--ok-bg:#dff5ea;--bad:#c2381c;--soft:#e9edfb;--pic:#fff;
--f-display:'Comfortaa','Noto Sans',system-ui,sans-serif;--f-body:'Noto Sans',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12162a;--card:#1b2140;--fg:#e8ecfb;--muted:#a0a9cc;--line:#323a66;--accent:#8e9bff;--accent-fg:#10142b;--ok:#5fd6a0;--ok-bg:#16382d;--bad:#ff8f77;--soft:#262d57;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12162a;--card:#1b2140;--fg:#e8ecfb;--muted:#a0a9cc;--line:#323a66;--accent:#8e9bff;--accent-fg:#10142b;--ok:#5fd6a0;--ok-bg:#16382d;--bad:#ff8f77;--soft:#262d57;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:18px;line-height:1.4;margin:0;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:820px;width:100%;min-width:0;margin:0 auto;display:flex;flex-direction:column;gap:18px}.wrap>*{min-width:0}
h1,h2{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.25}h1{font-size:1.7rem}
header{display:flex;flex-direction:column;gap:6px}header p{margin:0;color:var(--muted);font-size:.95rem}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.who{display:flex;gap:8px;align-items:center;flex:1 1 240px;min-width:0}
.who input{flex:1;min-width:0;font:inherit;font-size:1.1rem;color:var(--fg);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 12px}
.stars{font-family:var(--f-display);font-weight:700;background:var(--soft);padding:8px 16px;border-radius:999px;font-size:1.2rem;white-space:nowrap}
.ex{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px}
.ex.done{border-color:var(--ok)}
.eh{display:flex;gap:10px;align-items:center}
.num{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--accent-fg);font-family:var(--f-display);font-weight:700;font-size:1.2rem}
.eh h2{flex:1;font-size:1.05rem}
.spk{flex:none;font-size:1.5rem;width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--soft);cursor:pointer}
.star{flex:none;font-size:1.7rem;filter:grayscale(1);opacity:.35}.done .star{filter:none;opacity:1}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));align-items:center}
.card{position:relative;background:var(--pic);border:3px solid var(--line);border-radius:16px;padding:8px;display:grid;place-items:center;cursor:pointer;min-width:0;font:inherit;color:inherit}
.card img{max-width:100%;height:auto;display:block;pointer-events:none}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent)}
.card.ok{border-color:var(--ok);background:var(--ok-bg)}
.card.bad{border-color:var(--bad)}
.badge{position:absolute;top:-10px;left:-10px;background:var(--ok);color:#fff;border-radius:50%;width:38px;height:38px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.3rem}
.shake{animation:sh .35s}@keyframes sh{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.nb{font:inherit;font-family:var(--f-display);font-weight:700;font-size:1.4rem;width:52px;height:52px;border-radius:14px;border:3px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.nb.ok{background:var(--ok-bg);border-color:var(--ok)}.nb.bad{border-color:var(--bad)}
.cnt{display:flex;flex-direction:column;gap:8px;align-items:center;background:var(--soft);border-radius:16px;padding:10px;min-width:0}
.cnt img{max-width:100%;height:auto;background:var(--pic);border-radius:10px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px 40px}
.cols>div{display:flex;flex-direction:column;gap:12px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{min-height:90px;border:3px dashed var(--line);border-radius:14px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.6rem;color:var(--muted);cursor:pointer;padding:4px;background:var(--soft);min-width:0}
.slot img{max-width:100%;height:auto}.slot.ok{border-style:solid;border-color:var(--ok);background:var(--pic)}
.pool{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.pool .card{padding:4px}
.cvw{position:relative;width:100%;max-width:100%}
.cvw img.bg{display:block;width:100%;height:auto;background:var(--pic);border-radius:14px;border:2px solid var(--line)}
.cvw canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;border-radius:14px}
canvas.free{position:static;display:block;background:#fff;border:2px solid var(--line);aspect-ratio:3/2;height:auto}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.sw{width:42px;height:42px;border-radius:50%;border:3px solid var(--line);cursor:pointer;padding:0}.sw[aria-pressed=true]{border-color:var(--fg);outline:3px solid var(--accent);outline-offset:2px}
.btn{font:inherit;font-family:var(--f-display);font-weight:700;padding:10px 18px;border-radius:14px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-fg);cursor:pointer;font-size:1.05rem}.btn.alt{background:transparent;color:var(--accent)}
.col svg{width:100%;max-width:420px;height:auto;margin-inline:auto;display:block;background:#fff;border-radius:14px;border:2px solid var(--line)}
.col svg .p{cursor:pointer}
.row .card{width:140px}
.big{font-size:2.2rem;text-align:center}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (max-width:520px){.cols{gap:12px 14px}.slots,.pool{gap:6px}}
</style>
<div class="wrap">
<header><h1>Ξύπνα τον υπολογιστή! 💻</h1><p>Πληροφορική Α΄ Δημοτικού • Πάτα και ζωγράφισε με το δάχτυλο ή το ποντίκι</p></header>
<div class="top"><label class="who">Το όνομά μου: <input type="text" id="nm" autocomplete="off"></label><div class="stars" id="st" aria-live="polite">⭐ 0 / 12</div></div>
<div id="exs" class="wrap" style="gap:18px"></div>

o=sec(5,'Περνάω με το δάχτυλο πάνω από τις τελίτσες: το ποντίκι πάει στο κουμπί «Έναρξη»','Πέρασε με το δάχτυλό σου πάνω από τις τελίτσες, από το ποντίκι ως το κουμπί Έναρξη.');drawing(o,'trace',640/1500,(()=>{const sx=265,sy=340,ex=1105,ey=300,a=[];for(let i=0;i<=120;i+=4){const t=i/120;a.push([(sx+(ex-sx)*t)/1500,(sy+(ey-sy)*t-Math.sin(t*Math.PI*2)*110)/1500])}return a})(),0.04);
o=sec(6,'Ζωγραφίζω τον υπολογιστή μου όταν είναι ξύπνιος','Ζωγράφισε τον υπολογιστή σου όταν είναι ξύπνιος.');drawing(o,null,0);
o=sec(7,'Όταν τελειώσω το παιχνίδι: πατάω τον υπολογιστή που έκλεισα σωστά','Πάτα τον υπολογιστή που έκλεισες σωστά.');pick(o,[['c_sad',0],['c_zzz',1]]);
o=sec(8,'Μετράω τους υπολογιστές και πατάω τον αριθμό','Μέτρησε τους υπολογιστές και πάτα τον σωστό αριθμό.');count(o,[['cnt3',3],['cnt5',5]]);
o=sec(9,'Ενώνω κάθε συσκευή με αυτό που κάνει','Πάτα μια συσκευή και μετά αυτό που κάνει.');match(o,['mon','mouse','kb'],['i_eye','i_hand','i_abc'],{0:0,1:1,2:2});
o=sec(10,'Βάζω τις εικόνες στη σωστή σειρά 1, 2, 3, 4','Πάτα μια εικόνα και μετά το σωστό τετραγωνάκι.');cut(o,['o_button','o_awake','o_start','o_shutdown']);
o=sec(11,'Συνεχίζω το μοτίβο: ποιο προσωπάκι μπαίνει στο ;','Ποιο προσωπάκι μπαίνει στη θέση του ερωτηματικού;');o.body.append(im('pattern'));o.body.lastChild.style.cssText='width:100%;height:auto;background:var(--pic);border-radius:14px';pick(o,[['p_a',0],['p_s',1]],'row');
o=sec(12,'Περνάω με το δάχτυλο πάνω από τις τελίτσες: το κουμπί λειτουργίας','Πέρασε με το δάχτυλό σου πάνω από τις τελίτσες του κουμπιού λειτουργίας.');drawing(o,'trace_power',420/700,(()=>{const a=[],cx=350,cy=240,r=125;for(let g=-48;g<=228;g+=8){const t=g*Math.PI/180;a.push([(cx+r*Math.cos(t))/700,(cy+r*Math.sin(t))/700])}for(let y=cy-156;y<cy-5;y+=28)a.push([cx/700,y/700]);return a})(),0.045);
