<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html{color-scheme:light}body{margin:0}</style><title>Ψηφιακό Φύλλο Ασφάλειας Διαδικτύου</title>

<style>
/* Layout: one column, 4 tabs (one per worksheet page), theory card then exercises that check themselves. */
:root{
  --bg:#f3f5fb; --card:#ffffff; --fg:#1b2238; --muted:#5a6482; --line:#d5daea;
  --accent:#3447c9; --accent-fg:#ffffff; --ok:#16875a; --ok-bg:#dff5ea; --bad:#c2381c; --bad-bg:#fde6df;
  --theory:#fff3d1; --theory-line:#e9c45a; --soft:#e9edfb;
  --f-display:'Comfortaa','Noto Sans',system-ui,sans-serif; --f-body:'Noto Sans',system-ui,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12162a; --card:#1b2140; --fg:#e8ecfb; --muted:#a0a9cc; --line:#323a66;
  --accent:#8e9bff; --accent-fg:#10142b; --ok:#5fd6a0; --ok-bg:#16382d; --bad:#ff8f77; --bad-bg:#43211b;
  --theory:#3a3320; --theory-line:#8a7430; --soft:#262d57; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12162a; --card:#1b2140; --fg:#e8ecfb; --muted:#a0a9cc; --line:#323a66;
  --accent:#8e9bff; --accent-fg:#10142b; --ok:#5fd6a0; --ok-bg:#16382d; --bad:#ff8f77; --bad-bg:#43211b;
  --theory:#3a3320; --theory-line:#8a7430; --soft:#262d57; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.55;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:820px;width:100%;min-width:0;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.wrap>*{min-width:0}
.item select{max-width:100%;min-width:0}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:1.65rem}
header{display:flex;flex-direction:column;gap:6px}
header p{margin:0;color:var(--muted);font-size:.95rem}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.name{display:flex;gap:8px;align-items:center;flex:1 1 220px;min-width:0}
.name input{flex:1;min-width:0}
input[type=text],textarea,select{font:inherit;color:var(--fg);background:var(--card);border:2px solid var(--line);border-radius:10px;padding:8px 10px}
textarea{width:100%;min-height:84px;resize:vertical}
select{max-width:100%}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.score{font-family:var(--f-display);font-weight:700;background:var(--soft);padding:8px 14px;border-radius:999px;white-space:nowrap}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
nav button{font:inherit;font-family:var(--f-display);font-weight:700;font-size:.9rem;padding:10px 6px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;min-width:0}
nav button[aria-selected=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
nav small{display:block;font-weight:400;font-family:var(--f-body);opacity:.85}
.theory{background:var(--theory);border:2px solid var(--theory-line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.theory h2{font-size:1.2rem}
.theory p{margin:0}
.theory b{color:var(--accent)}
.ex{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.ex>h3{font-size:1.05rem;display:flex;gap:10px;align-items:center}
.num{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-fg);font-size:1rem}
.hint{margin:0;color:var(--muted);font-size:.92rem}
.item{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:12px;border:2px solid transparent;background:var(--soft)}
.item .t{flex:1 1 260px;min-width:0}
.item.ok{background:var(--ok-bg);border-color:var(--ok)}
.item.bad{background:var(--bad-bg);border-color:var(--bad)}
.item.miss{border-style:dashed;border-color:var(--ok)}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{font:inherit;font-weight:600;padding:7px 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.opt[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chk{display:flex;gap:10px;align-items:center;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.bank span{background:var(--soft);border-radius:999px;padding:4px 14px;font-weight:600}
.sent{padding:8px 10px;border-radius:12px;background:var(--soft);border:2px solid transparent;line-height:2.1}
.sent select{margin-inline:4px}
.msg{border-radius:12px;padding:10px 14px;background:var(--soft);border:2px dashed var(--line);font-style:italic}
.msg b{font-style:normal;color:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font:inherit;font-family:var(--f-display);font-weight:700;padding:9px 18px;border-radius:12px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-fg);cursor:pointer}
.btn.alt{background:transparent;color:var(--accent)}
.res{font-weight:700}
.res.good{color:var(--ok)}.res.try{color:var(--bad)}
.sample{background:var(--ok-bg);border:2px solid var(--ok);border-radius:12px;padding:10px 14px}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.steps li{display:flex;gap:10px}
.steps li::before{content:"✔";color:var(--ok);font-weight:700}
.selfcheck{background:var(--soft);border-radius:16px;padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.pn{display:flex;justify-content:space-between;gap:10px}
@media (max-width:520px){.item select{width:100%} nav small{display:none} body{font-size:16px}}
@media (prefers-reduced-motion:no-preference){.item{transition:background .2s,border-color .2s}}
</style>

let cur=0;const $=s=>document.querySelector(s);const state={};
const gradable=SECTIONS.flatMap(s=>s.ex).filter(e=>['multi','match','choice','fill'].includes(e.type));
const maxOf=e=>e.type==='multi'?e.correct.length:e.type==='match'?e.answer.length:e.type==='choice'?e.items.length:e.answers.length;
const MAX=gradable.reduce((a,e)=>a+maxOf(e),0);
const pts={};
function upd(){const s=Object.values(pts).reduce((a,b)=>a+b,0);$('#score').textContent='Πόντοι: '+s+' / '+MAX}
function res(box,got,max){const r=box.querySelector('.res');r.className='res '+(got===max?'good':'try');r.textContent=got===max?'Μπράβο! '+got+'/'+max+' σωστά':got+'/'+max+' σωστά. Δες τα κόκκινα και ξαναδοκίμασε.'}
function exBox(e){
  const box=document.createElement('section');box.className='ex';box.id='ex'+e.n;
  const st=state[e.n]=state[e.n]||{};
  let h='<h3><span class="num">'+e.n+'</span>'+e.title+'</h3>';
  if(e.hint)h+='<p class="hint">'+e.hint+'</p>';
  if(e.pre)h+=e.pre;
  const L='ΑΒΓΔΕΖ';
  if(e.type==='multi'){h+=e.items.map((t,i)=>'<label class="item chk" data-i="'+i+'"><span class="t">'+t+'</span><input type="checkbox" '+(st[i]?'checked':'')+'></label>').join('')}
  if(e.type==='match'){h+='<div class="hint">'+e.right.map((r,i)=>L[i]+'. '+r).join(' • ')+'</div>'+e.left.map((t,i)=>'<div class="item" data-i="'+i+'"><span class="t">'+(i+1)+'. '+t+'</span><select aria-label="'+t+'"><option value="">Διάλεξε…</option>'+e.right.map((r,j)=>'<option value="'+j+'"'+(st[i]===j?' selected':'')+'>'+L[j]+'. '+r+'</option>').join('')+'</select></div>').join('')}
  if(e.type==='choice'){h+=e.items.map((it,i)=>'<div class="item" data-i="'+i+'"><span class="t">'+(i+1)+'. '+it[0]+'</span><span class="opts">'+e.labels.map((l,j)=>'<button class="opt" data-j="'+j+'" aria-pressed="'+(st[i]===j)+'">'+l+'</button>').join('')+'</span></div>').join('')}
  if(e.type==='fill'){h+='<div class="bank">'+e.bank.map(b=>'<span>'+b+'</span>').join('')+'</div>';let k=0;h+=e.sents.map(s=>'<div class="sent" data-s>'+s.replace(/\{\}/g,()=>{const i=k++;return '<select data-k="'+i+'"><option value="">…</option>'+e.bank.map(b=>'<option'+(st[i]===b?' selected':'')+'>'+b+'</option>').join('')+'</select>'}).replace(/&/g,'&amp;')+'</div>').join('')}
  if(e.type==='open'){h+='<textarea aria-label="'+e.title+'" placeholder="Γράψε εδώ…">'+(st.v||'')+'</textarea>'+(e.sample?'<div class="actions"><button class="btn alt" data-sample>Δες ενδεικτική απάντηση</button></div><div class="sample" hidden>'+e.sample+'</div>':'')}
  if(e.type==='open2'){h+=e.qs.map((q,i)=>'<p style="margin:0">'+q.q+'</p><textarea aria-label="'+q.q+'" data-q="'+i+'" placeholder="Γράψε εδώ…">'+(st['q'+i]||'')+'</textarea><div class="sample" hidden>'+q.sample+'</div>').join('')+'<div class="actions"><button class="btn alt" data-sample2>Δες ενδεικτικές απαντήσεις</button></div>'}
  if(gradable.includes(e))h+='<div class="actions"><button class="btn" data-check>Έλεγχος</button><span class="res" aria-live="polite"></span></div>';
  box.innerHTML=h;
  // wiring
  box.querySelectorAll('.chk input').forEach(c=>c.onchange=()=>{st[c.closest('.item').dataset.i]=c.checked});
  box.querySelectorAll('.item select').forEach(s=>s.onchange=()=>{st[s.closest('.item').dataset.i]=s.value===''?undefined:+s.value});
  box.querySelectorAll('.item .opt').forEach(b=>b.onclick=()=>{const i=+b.closest('.item').dataset.i;st[i]=+b.dataset.j;b.parentNode.querySelectorAll('.opt').forEach(o=>o.setAttribute('aria-pressed',o===b))});
  box.querySelectorAll('.sent select').forEach(s=>s.onchange=()=>{st[+s.dataset.k]=s.value||undefined});
  const ta=box.querySelector('textarea:not([data-q])');if(ta)ta.oninput=()=>{st.v=ta.value};
  box.querySelectorAll('textarea[data-q]').forEach(t=>t.oninput=()=>{st['q'+t.dataset.q]=t.value});
  const sb=box.querySelector('[data-sample]');if(sb)sb.onclick=()=>{const s=box.querySelector('.sample');s.hidden=!s.hidden};
  const sb2=box.querySelector('[data-sample2]');if(sb2)sb2.onclick=()=>box.querySelectorAll('.sample').forEach(s=>s.hidden=!s.hidden);
  const cb=box.querySelector('[data-check]');
  if(cb)cb.onclick=()=>{
    let got=0;const items=[...box.querySelectorAll('.item')];items.forEach(x=>x.classList.remove('ok','bad','miss'));
    if(e.type==='multi'){items.forEach((x,i)=>{const on=!!st[i],c=e.correct.includes(i);if(on&&c){x.classList.add('ok');got++}else if(on)x.classList.add('bad');else if(c)x.classList.add('miss')});const wrong=items.filter(x=>x.classList.contains('bad')).length;got=Math.max(0,got-wrong)}
    if(e.type==='match'){items.forEach((x,i)=>{if(st[i]===e.answer[i]){x.classList.add('ok');got++}else x.classList.add('bad')})}
    if(e.type==='choice'){items.forEach((x,i)=>{if(st[i]===e.items[i][1]){x.classList.add('ok');got++}else x.classList.add('bad')})}
    if(e.type==='fill'){box.querySelectorAll('.sent').forEach(x=>x.classList.remove('ok','bad'));let k=0;box.querySelectorAll('.sent').forEach(x=>{let all=true;x.querySelectorAll('select').forEach(s=>{if(st[k]===e.answers[k])got++;else all=false;k++});x.classList.add(all?'ok':'bad')})}
    pts[e.n]=got;res(box,got,maxOf(e));upd()};
  return box;
}
function render(){
  const S=SECTIONS[cur];const p=$('#page');p.innerHTML='';
  const th=document.createElement('section');th.className='theory';
  let h='<h2>'+S.theory.h+'</h2>';
  if(S.theory.p)h+=S.theory.p.map(x=>'<p>'+x+'</p>').join('');
  if(S.theory.steps)h+='<ul class="steps">'+S.theory.steps.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
  th.innerHTML=h;p.appendChild(th);
  S.ex.forEach(e=>p.appendChild(exBox(e)));
  if(S.final){const f=document.createElement('section');f.className='selfcheck';f.innerHTML='<h3>Σύνοψη</h3><p style="margin:0">Το διαδίκτυο και το Διαδίκτυο των Πραγμάτων είναι πολύ χρήσιμα εργαλεία, αρκεί να τα χρησιμοποιούμε με προσοχή.</p><label class="chk"><input type="checkbox"> Ξέρω τι είναι το IoT</label><label class="chk"><input type="checkbox"> Ξεχωρίζω ύποπτα μηνύματα</label><label class="chk"><input type="checkbox"> Ξέρω πώς προστατεύομαι</label>';p.appendChild(f)}
  document.querySelectorAll('#tabs button').forEach((b,i)=>b.setAttribute('aria-selected',i===cur));
  $('#prev').style.visibility=cur===0?'hidden':'visible';$('#next').style.visibility=cur===SECTIONS.length-1?'hidden':'visible';
}
$('#tabs').innerHTML=SECTIONS.map((s,i)=>'<button role="tab" data-i="'+i+'">'+(i+1)+'<small>'+s.short+'</small></button>').join('');
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;render();window.scrollTo(0,0)});
$('#prev').onclick=()=>{cur=Math.max(0,cur-1);render();window.scrollTo(0,0)};
$('#next').onclick=()=>{cur=Math.min(SECTIONS.length-1,cur+1);render();window.scrollTo(0,0)};
render();upd();
</script>
</body></html>
