x;font-weight:700;line-height:1.1}.mem .cd.up{background:var(--card);color:var(--fg)}.mem .cd.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.mem .cd .w{font-size:.8rem}.pw{display:flex;flex-direction:column;gap:3px;font-size:.92rem;width:100%}</style><style>.ex{display:none}.ex.cur{display:block}

<div class="wrap">
<header>
 <h1>💻 Παίζω και μαθαίνω 🖱️</h1>
 <div class="sub">Πληροφορική • Β΄ Δημοτικού • 10 ασκήσεις</div>
 <div class="who"><label>Όνομα: <input id="nm" autocomplete="off"></label><label>Τμήμα: <input id="cl" class="cl" autocomplete="off"></label></div>
 <div class="prog" id="prog" aria-live="polite"></div>
 <button class="btn" id="pr">🖨️ Εκτύπωση / PDF</button> <button class="btn" id="fs" hidden>⛶ Πλήρης οθόνη</button><div id="note" class="msg" style="margin-top:6px" aria-live="polite"></div>
</header>
<section class="theory"><h2>🎮 Πώς παίζω</h2><p>Κάθε άσκηση είναι μια <b>κάρτα</b>. Λύσε την, πάτα <b>Έλεγξε ✔</b> και μετά <b>Επόμενη ▶</b>.</p></section>

<main id="exs" class="wrap"></main>
<div class="nav"><button class="btn" id="pv">◀ Προηγούμενη</button><span id="pos"></span><button class="btn" id="nx">Επόμενη ▶</button></div><div id="dots"></div>
<div class="fin" id="fin"></div>
</div>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const shk=e=>{e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake')};
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='el-GR';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
const TOTAL=10,doneSet=new Set(),COL=['#2e5fa8','#e4572e','#7a5cc8','#2e9e5b','#e9a100'];
function upd(){$('#prog').textContent='⭐'.repeat(doneSet.size)+'☆'.repeat(TOTAL-doneSet.size);$('#fin').classList.toggle('on',doneSet.size===TOTAL)}
upd();
function ex(n,title,instr,build){
 const s=el('section','ex');s.id='e'+n;
 s.innerHTML=`<div class="hd"><div class="num" style="background:${COL[(n-1)%5]}">${n}</div><div class="tt"><h2>${title}</h2>${instr?`<p>${instr}</p>`:''}</div><span class="badge">⭐</span><button class="say" aria-label="Άκουσε">🔊</button></div><div class="body"></div><div class="ft"><button class="btn chk">Έλεγξε ✔</button><span class="msg"></span></div>`;
 $('#exs').appendChild(s);
 const b=$('.body',s),qs=[],msg=$('.msg',s);
 const fin=()=>{if(doneSet.has(n))return;doneSet.add(n);s.classList.add('done');msg.textContent='🎉 Μπράβο!';upd()};
 $('.say',s).onclick=()=>say(title+'. '+(instr||'').replace(/<[^>]+>/g,''));
 build(b,q=>{qs.push(q);b.appendChild(q);q.addEventListener('input',()=>q.classList.remove('ok','bad'));q.addEventListener('click',()=>q.classList.remove('ok','bad'));return q},fin);
 $('.chk',s).onclick=()=>{let all=true;qs.forEach(q=>{const ok=q.isOk();q.classList.toggle('ok',ok);q.classList.toggle('bad',!ok);if(!ok){all=false;shk(q)}});if(all)fin();else msg.textContent='Κοίτα ξανά τα κόκκινα πλαίσια 🙂'};
}
const norm=v=>v.trim().toLowerCase().replace(/[“”"]/g,'');
function choiceQ(add,text,opts,correct){
 const q=el('div','q',`<div class="t">${text}</div>`),o=el('div','opts');q.appendChild(o);q.val=null;
 opts.forEach(x=>{const b=el('button','btn',x);b.onclick=()=>{$$('.btn',o).forEach(z=>z.classList.remove('sel'));b.classList.add('sel');q.val=x};o.appendChild(b)});
 q.isOk=()=>q.val===correct;return add(q)}
function fillQ(add,html){ // [[ans|alt]] -> input
 const q=el('div','q');q.innerHTML='<div class="t">'+html.replace(/\[\[(.+?)\]\]/g,(m,a)=>`<input data-a="${a}" inputmode="${/^\d+$/.test(a)?'numeric':'text'}" autocomplete="off"${/^\d+$/.test(a)?'':' class="w"'}>`)+'</div>';
 q.isOk=()=>$$('input',q).every(i=>i.dataset.a.split('|').includes(norm(i.value)));return add(q)}
function cyc(c){c.onclick=()=>{c.v=c.v===''?'0':c.v==='0'?'1':'';c.textContent=c.v}}
function cellsQ(add,pre,n,pred){ // row/grid of cycle cells
 const q=el('div','q');if(pre)q.appendChild(el('div','t',pre));
 const g=el('div','gridw full');g.style.setProperty('--n',8);g.style.gridTemplateColumns='repeat(8,1fr)';

 let down=false,lx=0,ly=0;const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*640/r.width,(e.clientY-r.top)*480/r.height]};
 cv.addEventListener('pointerdown',e=>{down=true;[lx,ly]=pos(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}x.fillStyle=erase?'#fff':col;const w=erase?(size>10?110:60):size;x.beginPath();x.arc(lx,ly,w/2,0,7);x.fill();if(!erase)drew=true});

function robotQ(add){const q=el('div','q');const N=4,start=[3,0],goal=[1,3],rock=[3,2];let prog=[],busy=false;
 const g=el('div','rgrid');g.style.cssText='display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-width:260px;margin:0 auto;width:100%';
 const cells=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++){const d=el('div','rc');d.style.cssText='aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:1.8rem;background:#fff;border:2px solid var(--mintb);border-radius:10px';cells.push(d)}
 cells.forEach(c=>g.appendChild(c));
 const put=(rp)=>{cells.forEach((c,i)=>{const r=i/N|0,cc=i%N;c.textContent=(r===goal[0]&&cc===goal[1])?'⭐':(r===rock[0]&&cc===rock[1])?'🪨':'';if(r===rp[0]&&cc===rp[1])c.textContent='🤖'})};
 let pos=start.slice();put(pos);
 const list=el('div','t');const msg=el('div','t');const tools=el('div','tools');
 const draw=()=>{list.textContent='Πρόγραμμα: '+(prog.length?prog.join(' '):'(άδειο)')};draw();
 const D={'⬆️':[-1,0],'⬇️':[1,0],'⬅️':[0,-1],'➡️':[0,1]};
 Object.keys(D).forEach(k=>{const b=el('button','btn',k);b.onclick=()=>{if(busy||prog.length>=14)return;prog.push(k);draw();msg.textContent='';q.classList.remove('ok','bad')};tools.appendChild(b)});
 const del=el('button','btn','⌫ Σβήσε'),run=el('button','btn run','▶ Τρέξε'),clr=el('button','btn','🗑️ Καθαρισμός');
 del.onclick=()=>{if(busy)return;prog.pop();draw()};clr.onclick=()=>{if(busy)return;prog=[];pos=start.slice();put(pos);draw();msg.textContent=''};
 let won=false;
 run.onclick=async()=>{if(busy)return;busy=true;pos=start.slice();put(pos);won=false;msg.textContent='';
  for(const k of prog){await new Promise(r=>setTimeout(r,350));const n=[pos[0]+D[k][0],pos[1]+D[k][1]];
   if(n[0]<0||n[1]<0||n[0]>=N||n[1]>=N){msg.textContent='🚧 Βγήκε έξω από το πλέγμα! Δοκίμασε ξανά.';busy=false;return}
   if(n[0]===rock[0]&&n[1]===rock[1]){pos=n;put(pos);msg.textContent='💥 Χτύπησε στον βράχο! Δοκίμασε ξανά.';busy=false;return}
   pos=n;put(pos)}
  if(pos[0]===goal[0]&&pos[1]===goal[1]){won=true;msg.textContent='🎉 Το ρομπότ πήρε το αστέρι!'}else msg.textContent='Δεν έφτασε στο αστέρι. Δοκίμασε ξανά.';busy=false};
 tools.append(del,run,clr);q.append(g,list,tools,msg);q.isOk=()=>won;return add(q)}
