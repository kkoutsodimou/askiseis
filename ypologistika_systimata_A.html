<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html{color-scheme:light}body{margin:0}</style><title>Γνωρίζω τους υπολογιστές</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#f7fbf9;--fg:#1d2b3a;--muted:#5b6b7b;--mint:#d6f3e4;--mint2:#bfeacf;--mintb:#8fd3ae;--card:#ffffff;--accent:#2e5fa8;--ok:#1e9e57;--bad:#e4572e;--star:#f2b705;--sel:#ffe9a8;--lilac:#ece4fa;--lilacb:#c4aeea;--shadow:0 2px 8px rgba(30,60,50,.12)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13201b;--fg:#e8f3ee;--muted:#a3b8ad;--mint:#1f3a2e;--mint2:#27493a;--mintb:#3f7a5e;--card:#1a2c25;--accent:#7fb0ff;--ok:#4cd68a;--bad:#ff8a65;--star:#ffd54a;--sel:#5a4a14;--lilac:#2f2748;--lilacb:#6f5aa8;--shadow:0 2px 8px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13201b;--fg:#e8f3ee;--muted:#a3b8ad;--mint:#1f3a2e;--mint2:#27493a;--mintb:#3f7a5e;--card:#1a2c25;--accent:#7fb0ff;--ok:#4cd68a;--bad:#ff8a65;--star:#ffd54a;--sel:#5a4a14;--lilac:#2f2748;--lilacb:#6f5aa8;--shadow:0 2px 8px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:"Comic Sans MS","Trebuchet MS",system-ui,sans-serif;font-size:18px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{background:var(--mint);border:3px solid var(--mintb);border-radius:20px;padding:14px 16px;text-align:center}
h1{margin:0;font-size:1.7rem;color:var(--accent);text-wrap:balance}
.sub{color:var(--muted);font-size:.95rem}
.who{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;justify-content:center}
.who label{display:flex;gap:6px;align-items:center;font-size:1rem}
.who input{font:inherit;padding:6px 10px;border-radius:10px;border:2px solid var(--mintb);background:var(--card);color:var(--fg);min-width:0;width:min(230px,60vw)}
.who input.cl{width:90px}
.prog{margin-top:8px;font-size:1.3rem;min-height:1.8rem}
.ex{background:var(--mint);border:3px solid var(--mintb);border-radius:20px;padding:14px;box-shadow:var(--shadow);position:relative}
.ex.done{border-color:var(--ok)}
.ex .hd{display:flex;gap:10px;align-items:center;margin-bottom:12px;background:var(--lilac);border:3px solid var(--lilacb);border-radius:16px;padding:8px 10px}
.num{flex:none;width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}
.ex h2{margin:0;font-size:1.15rem;flex:1;text-wrap:balance}
.say{flex:none;border:0;background:var(--card);border-radius:50%;width:42px;height:42px;font-size:1.3rem;cursor:pointer;box-shadow:var(--shadow)}
.badge{display:none;font-size:1.8rem}
.ex.done .badge{display:block;animation:pop .5s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.4)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.shake{animation:shake .35s}
.grid{display:grid;gap:10px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.tile{background:var(--card);border:3px solid transparent;border-radius:16px;padding:6px;display:grid;place-items:center;cursor:pointer;min-width:0;aspect-ratio:1;font:inherit;color:inherit}
.tile img{width:80%;max-width:110px;pointer-events:none}
.tile.sel{border-color:var(--ok);background:var(--sel)}
.tile.sel::after{content:"✓";position:absolute;font-size:1.6rem;color:var(--ok);transform:translate(26px,-26px)}
.tile{position:relative}
.tile.locked{border-color:var(--ok);cursor:default}
.row{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:16px;padding:8px;margin-bottom:8px;flex-wrap:wrap}
.row.ok{outline:3px solid var(--ok)}
.row img{height:56px;width:56px}
.btn{font:inherit;border:3px solid var(--mintb);background:var(--card);color:var(--fg);border-radius:14px;padding:6px 12px;cursor:pointer;min-width:44px;min-height:44px}
.btn.sel{border-color:var(--accent);background:var(--sel)}
.btn.ok{border-color:var(--ok);background:var(--mint2);cursor:default}
.btn img{height:48px;width:48px;vertical-align:middle}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px}
.mt .col{display:flex;flex-direction:column;gap:8px}
.mt .btn{display:flex;align-items:center;justify-content:center;min-height:62px;text-align:center;font-size:.95rem;font-weight:700}
.mt .btn.m0{background:#ffd9d9;border-color:#e57373}.mt .btn.m1{background:#d9e8ff;border-color:#6c9cf0}.mt .btn.m2{background:#e6d9ff;border-color:#9b7be0}.mt .btn.m3{background:#d9f5d9;border-color:#5cc06b}.mt .btn.m4{background:#ffe9c7;border-color:#e9a100}.mt .btn.m5{background:#d9f3f3;border-color:#3fb3b3}
.cnt{display:flex;flex-wrap:wrap;gap:4px;flex:1;min-width:150px}.cnt img{height:42px;width:42px}
.nums{display:flex;gap:6px;flex-wrap:wrap}.big .nums{flex-wrap:nowrap;align-items:flex-end;justify-content:center;width:100%}.big .btn{padding:4px 6px}
.pal{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid var(--card);cursor:pointer;padding:0}
.sw.on{outline:3px solid var(--fg)}
canvas{width:100%;background:#fff;border-radius:14px;border:3px dashed var(--mintb);touch-action:none;display:block}
.tools{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.seq{display:flex;gap:4px;align-items:center}.seq img{height:44px;width:44px}.seq .q{width:44px;font-size:1.6rem}
.q{font-size:2rem;width:52px;text-align:center}
.big{align-items:flex-end;justify-content:center}
.faces{display:flex;gap:12px;justify-content:center}
.face{background:var(--card);border:3px solid transparent;border-radius:18px;padding:8px;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;align-items:center;gap:4px}
.face img{width:76px;height:76px}.face.sel{border-color:var(--ok);background:var(--sel)}
.face span{font-size:.8rem;color:var(--muted);font-weight:700}
.fin{text-align:center;font-size:1.5rem;display:none}
.fin.on{display:block}
@media(max-width:420px){body{font-size:16px}.g4{gap:6px}}
</style>
<div class="wrap">
<header>
 <h1>Γνωρίζω τους υπολογιστές!</h1>
 <div class="sub">Πληροφορική Α΄ Δημοτικού</div>
 <div class="who"><label>Όνομα: <input id="nm" autocomplete="off"></label><label>Τμήμα: <input id="cl" class="cl" autocomplete="off"></label></div>
 <div class="prog" id="prog" aria-live="polite"></div>
 <button class="btn" id="fs" hidden>⛶ Πλήρης οθόνη</button>
</header>
<main id="exs" class="wrap" style="gap:18px"></main>
<div class="fin" id="fin">🎉 Μπράβο! Τα κατάφερες! 🎉</div>
</div>
